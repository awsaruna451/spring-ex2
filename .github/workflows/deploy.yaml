name: Deploy Spring Boot to AWS (Terraform + ECS)

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO_NAME: my-ex2-repo
  ECS_CLUSTER: my-ecs-cluster        # ← Replace with your ECS cluster name
  ECS_SERVICE: my-ecs-service        # ← Replace with your ECS service name

jobs:
  # ══════════════════════════════════════════════════════════════
  # DEPLOY — Provision infra, build image, push to ECR, deploy ECS
  # ══════════════════════════════════════════════════════════════
  deploy:
    name: Terraform + Build + Deploy
    runs-on: ubuntu-latest
    outputs:
      terraform_applied: ${{ steps.tf-apply.outputs.applied }}

    steps:
      # ── 1. Source code ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. AWS credentials ────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── 3. Terraform — provision infra ────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # required for clean output parsing

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Plan
        run: terraform -chdir=terraform plan

      - name: Terraform Apply
        id: tf-apply
        run: |
          terraform -chdir=terraform apply -auto-approve \
          -var="image_tag=${{ github.sha }}"

      # ── 4. Resolve ECR URL ────────────────────────────────────
      - name: Get ECR URL
        run: |
          ACCOUNT_ID=$(echo "${{ secrets.AWS_ACCOUNT_ID }}" | tr -d '[:space:]')
          REGION=$(echo "${{ secrets.AWS_REGION }}"    | tr -d '[:space:]')
          echo "ECR_URL=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${{ env.ECR_REPO_NAME }}" >> $GITHUB_ENV

      # ── 5. Docker — build, tag, push ─────────────────────────
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: docker build -t $ECR_URL:${{ github.sha }} .

      - name: Tag Docker image
        run: |
          docker tag ${{ env.ECR_URL }}:${{ github.sha }}

      - name: Push Docker image
        run: docker push ${{ env.ECR_URL }}:${{ github.sha }}

      # ── 6. ECS — update service & wait for stability ──────────
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ secrets.AWS_REGION }}

  # ══════════════════════════════════════════════════════════════
  # CLEANUP — triggers automatically when deploy job fails
  # Only runs if Terraform actually applied (infra exists)
  # ══════════════════════════════════════════════════════════════
  cleanup-on-failure:
    name: Terraform Destroy (Rollback)
    runs-on: ubuntu-latest                          # ← was MISSING in original
    needs: deploy
    if: failure() && needs.deploy.outputs.terraform_applied == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false                  # ← was MISSING in original

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Destroy
        run: terraform -chdir=terraform destroy -auto-approve