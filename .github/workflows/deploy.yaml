name: Deploy Spring Boot to AWS (Terraform + ECS)

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPO_NAME: my-ex2-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      terraform_applied: ${{ steps.tf-apply.outputs.applied }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform -chdir=terraform init

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Terraform Plan
        run: terraform -chdir=terraform plan

      - name: Terraform Apply
        id: tf-apply                               # ← id needed for the output below
        run: |
          terraform -chdir=terraform apply -auto-approve
          echo "applied=true" >> $GITHUB_OUTPUT    # ← tells cleanup job infra exists

      - name: Get ECR URL
        run: |
          ACCOUNT_ID=$(echo "${{ secrets.AWS_ACCOUNT_ID }}" | tr -d '[:space:]')
          REGION=$(echo "${{ secrets.AWS_REGION }}" | tr -d '[:space:]')
          echo "ECR_URL=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/${{ env.ECR_REPO_NAME }}" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: docker build -t ${{ env.ECR_REPO_NAME }} .

      - name: Tag Docker image
        run: docker tag ${{ env.ECR_REPO_NAME }}:latest ${{ env.ECR_URL }}:latest

      - name: Push Docker image
        run: docker push ${{ env.ECR_URL }}:latest

  # ══════════════════════════════════════════════════════════════
  # CLEANUP — triggers automatically when deploy job fails
  # ══════════════════════════════════════════════════════════════
  cleanup-on-failure:
    name: Auto Cleanup on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()                                  # ← only runs when deploy fails

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init                       # ← reads state FROM S3
        run: terraform -chdir=terraform init

      - name: Terraform Destroy                    # ← destroys VPC, ALB, ECR, ECS
        if: needs.deploy.outputs.terraform_applied == 'true'
        run: terraform -chdir=terraform destroy -auto-approve

      - name: Clean up untagged ECR images
        run: |
          IMAGES=$(aws ecr list-images \
            --repository-name ${{ env.ECR_REPO_NAME }} \
            --filter tagStatus=UNTAGGED \
            --query 'imageIds[*]' \
            --output json 2>/dev/null || echo "[]")

          if [ "$IMAGES" != "[]" ] && [ -n "$IMAGES" ]; then
            echo "Deleting untagged images..."
            aws ecr batch-delete-image \
              --repository-name ${{ env.ECR_REPO_NAME }} \
              --image-ids "$IMAGES" || true
          else
            echo "No untagged images found."
          fi

      - name: Log cleanup result
        if: always()
        run: |
          echo "::error::Deploy failed — Terraform destroy completed."
          echo "::error::Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"