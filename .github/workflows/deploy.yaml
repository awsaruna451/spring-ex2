name: Deploy Spring Boot to AWS (Terraform + ECS)

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. Setup Terraform (moved up — needed to create ECR repo first)
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # Required to capture terraform output cleanly

      # 4. Terraform Init
      - name: Terraform Init
        run: terraform -chdir=terraform init

      # 5. Terraform Validate
      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      # 6. Terraform Plan
      - name: Terraform Plan
        run: terraform -chdir=terraform plan

      # 7. Terraform Apply — creates ECR repo + ECS infra
      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve


      # 8. Capture ECR URL from Terraform output
      - name: Get ECR repository URL
        id: ecr
        run: |
          ECR_URL=$(terraform -chdir=terraform output -raw ecr_repository_url)
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT

      # 9. Set ECR URL
      - name: Set ECR URL
        run: |
          ACCOUNT_ID=$(echo "${{ secrets.AWS_ACCOUNT_ID }}" | tr -d '[:space:]')
          REGION=$(echo "${{ secrets.AWS_REGION }}" | tr -d '[:space:]')
          echo "ECR_URL=${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/my-ex2-repo" >> $GITHUB_ENV

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
          | docker login --username AWS --password-stdin \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      # 11. Build Docker image
      - name: Build Docker image
        run: docker build -t my-ex2-repo .

      # 12. Tag Docker image
      - name: Tag Docker image
        run: docker tag my-ex2-repo:latest ${{ env.ECR_URL }}:latest

      # 13. Push Docker image to ECR
      - name: Push Docker image
        run: docker push ${{ env.ECR_URL }}:latest