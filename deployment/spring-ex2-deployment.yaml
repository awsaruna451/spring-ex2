apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-ex2
  labels:
    app: spring-ex2

spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-ex2

  template:
    metadata:
      labels:
        app: spring-ex2
      annotations:                                  # ← ADDED
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8181"                  # ← port 8181 (your app port)
        prometheus.io/job: "spring-ex2"

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: spring-ex2
          image: aruna451/spring-ex2:5.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8181

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m"

          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"

              # ← REMOVED volumeMounts (no file logging)

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8181
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8181
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8181
            failureThreshold: 30
            periodSeconds: 10

            # ← REMOVED volumes (no file logging)
      restartPolicy: Always