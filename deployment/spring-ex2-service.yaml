apiVersion: v1
kind: Service
metadata:
  name: spring-ex2-service
  annotations:                              # ← ADDED
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8181"
    prometheus.io/job: "spring-ex2"
spec:
  selector:
    app: spring-ex2
  ports:
    - protocol: TCP
      port: 8181
      targetPort: 8181
      nodePort: 30081
  type: NodePort